# EV-CyberRange Mosquitto Configuration
# INTENTIONALLY INSECURE for lab purposes - demonstrates attack surfaces

# Network listeners
listener 1883 0.0.0.0
listener 9001 0.0.0.0
protocol websockets

# INSECURE: Allow anonymous connections (attack surface)
allow_anonymous true

# Logging for attack analysis
log_type all
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Persistence
persistence true
persistence_location /mosquitto/data/

# Connection settings
max_connections -1
max_keepalive 120
