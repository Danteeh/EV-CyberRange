# EV-CyberRange - Complete Lab Stack with OCPP
# Usage: docker compose up -d
# First build: docker compose up -d --build

networks:
  ev-cyberrange:
    driver: bridge

services:
  # ============================================
  # CSMS - OCPP Central System (Python)
  # Port 9000: OCPP WebSocket
  # Port 9001: HTTP API
  # URL: ws://csms:9000/<charge_point_id>
  # ============================================
  csms:
    build:
      context: ./csms
      dockerfile: Dockerfile
    container_name: evcr-csms
    networks:
      - ev-cyberrange
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./shared-logs:/shared-logs
    environment:
      - OCPP_LOG_PATH=/shared-logs/ocpp_traffic.log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost',9000)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================
  # Charge Point Simulator 1 (connects to CSMS via OCPP)
  # This simulates an EVSE that talks OCPP to our CSMS
  # ============================================
  chargepoint-1:
    build:
      context: ./csms
      dockerfile: Dockerfile.chargepoint
    container_name: evcr-cp1
    networks:
      - ev-cyberrange
    depends_on:
      csms:
        condition: service_healthy
    environment:
      - CSMS_URL=ws://evcr-csms:9000
      - CHARGE_POINT_ID=EVCR-001
    restart: unless-stopped

  # ============================================
  # Charge Point Simulator 2
  # ============================================
  chargepoint-2:
    build:
      context: ./csms
      dockerfile: Dockerfile.chargepoint
    container_name: evcr-cp2
    networks:
      - ev-cyberrange
    depends_on:
      csms:
        condition: service_healthy
    environment:
      - CSMS_URL=ws://evcr-csms:9000
      - CHARGE_POINT_ID=EVCR-002
      - NUM_CONNECTORS=1
    restart: unless-stopped

  # ============================================
  # Charge Point Simulator 3
  # ============================================
  chargepoint-3:
    build:
      context: ./csms
      dockerfile: Dockerfile.chargepoint
    container_name: evcr-cp3
    networks:
      - ev-cyberrange
    depends_on:
      csms:
        condition: service_healthy
    environment:
      - CSMS_URL=ws://evcr-csms:9000
      - CHARGE_POINT_ID=EVCR-003
      - NUM_CONNECTORS=2
    restart: unless-stopped
    profiles:
      - full

  # ============================================
  # Charge Point Simulator 4
  # ============================================
  chargepoint-4:
    build:
      context: ./csms
      dockerfile: Dockerfile.chargepoint
    container_name: evcr-cp4
    networks:
      - ev-cyberrange
    depends_on:
      csms:
        condition: service_healthy
    environment:
      - CSMS_URL=ws://evcr-csms:9000
      - CHARGE_POINT_ID=EVCR-004
      - NUM_CONNECTORS=2
    restart: unless-stopped
    profiles:
      - full

  # ============================================
  # Charge Point Simulator 5 (DC Fast Charger)
  # ============================================
  chargepoint-5:
    build:
      context: ./csms
      dockerfile: Dockerfile.chargepoint
    container_name: evcr-cp5
    networks:
      - ev-cyberrange
    depends_on:
      csms:
        condition: service_healthy
    environment:
      - CSMS_URL=ws://evcr-csms:9000
      - CHARGE_POINT_ID=EVCR-005
      - NUM_CONNECTORS=1
      - MAX_POWER_KW=50
    restart: unless-stopped
    profiles:
      - full

  # ============================================
  # Charge Point Simulator 6 (DC Fast Charger)
  # ============================================
  chargepoint-6:
    build:
      context: ./csms
      dockerfile: Dockerfile.chargepoint
    container_name: evcr-cp6
    networks:
      - ev-cyberrange
    depends_on:
      csms:
        condition: service_healthy
    environment:
      - CSMS_URL=ws://evcr-csms:9000
      - CHARGE_POINT_ID=EVCR-006
      - NUM_CONNECTORS=1
      - MAX_POWER_KW=150
    restart: unless-stopped
    profiles:
      - full

  # ============================================
  # EVerest Charging Station Simulator
  # (Standalone - for comparison/parallel testing)
  # ============================================
  mqtt:
    image: ghcr.io/everest/everest-demo/mqtt-server:2025.10.0-single-phase
    container_name: everest-mqtt
    networks:
      - ev-cyberrange
    ports:
      - "1883:1883"
    restart: unless-stopped

  everest-manager:
    image: ghcr.io/everest/everest-demo/manager:2025.10.0-single-phase
    container_name: everest-manager
    networks:
      - ev-cyberrange
    depends_on:
      - mqtt
    environment:
      - MQTT_SERVER_ADDRESS=mqtt
    entrypoint: "sh /ext/build/run-scripts/run-sil.sh"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    restart: unless-stopped

  nodered:
    image: ghcr.io/everest/everest-demo/nodered:2025.10.0-single-phase
    container_name: everest-ui
    networks:
      - ev-cyberrange
    depends_on:
      - mqtt
    environment:
      - MQTT_SERVER_ADDRESS=mqtt
      - FLOWS=/config/config-sil-flow.json
    ports:
      - "1880:1880"
    restart: unless-stopped

  # ============================================
  # Kali Linux Attack Host (noVNC in browser)
  # ============================================
  kali:
    build:
      context: ./kali
      dockerfile: Dockerfile
    container_name: kali-attack
    networks:
      - ev-cyberrange
    ports:
      - "6080:6080"
      - "5901:5901"
    volumes:
      - ./shared-logs:/shared-logs:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
    depends_on:
      - mqtt
      - csms
    restart: unless-stopped

  # ============================================
  # FastAPI Backend
  # ============================================
  backend:
    build:
      context: ./simulator/backend
      dockerfile: Dockerfile
    container_name: evcr-backend
    networks:
      - ev-cyberrange
    ports:
      - "8000:8000"
    volumes:
      - ./shared-logs:/shared-logs:ro
    environment:
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - CSMS_WS_URL=ws://csms:9000
    depends_on:
      - mqtt
      - csms
    restart: unless-stopped
